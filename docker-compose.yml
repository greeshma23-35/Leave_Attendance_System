services:
  db:
    image: postgres:16-alpine
    container_name: leave_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-leave_attendance_db}
      POSTGRES_USER: ${DB_USER:-leave_attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leave_attendance_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: leave_attendance_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  nginx:
    image: nginx:1.27-alpine
    container_name: leave_attendance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
